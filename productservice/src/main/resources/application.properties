server.port=8082

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/appdb}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:apppassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

management.metrics.tags.application=product-service
